name: amharic_sudoku
description: Ge'ez Sudoku — Amharic Wordoku puzzle game. Solve Sudoku with Ethiopic fidel and discover hidden Amharic words.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sudoku_core:
    path: packages/sudoku_core
  flutter_riverpod: any
  go_router: any
  shared_preferences: any
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/puzzles/
    - assets/words/
    - assets/images/packs/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansEthiopic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansEthiopic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
    - family: NotoSerifEthiopic
      fonts:
        - asset: assets/fonts/NotoSerifEthiopic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifEthiopic-Bold.ttf
          weight: 700
